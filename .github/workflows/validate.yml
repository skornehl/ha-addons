name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  addon-lint:
    name: Add-on lint (${{ matrix.addon }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon:
          - dls_mein_essen_bridge
          - kleinanzeigen_bridge
    steps:
      - uses: actions/checkout@v4
      - name: Lint ${{ matrix.addon }}
        uses: frenck/action-addon-linter@v2
        with:
          path: "./${{ matrix.addon }}"

  base-image:
    name: Pinned base images still exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every digest-pinned FROM for amd64 and arm64
        run: |
          set -euo pipefail
          for f in */Dockerfile; do
            ref=$(sed -n 's/^FROM \(.*@sha256:[0-9a-f]*\).*/\1/p' "$f")
            [ -z "$ref" ] && continue
            echo "== $f: $ref"
            platforms=$(docker buildx imagetools inspect "$ref" --format '{{range .Manifest.Manifests}}{{.Platform.Architecture}} {{end}}')
            echo "platforms: $platforms"
            for arch in amd64 arm64; do
              echo "$platforms" | grep -qw "$arch" || { echo "::error file=$f::$ref has no $arch image"; exit 1; }
            done
          done
